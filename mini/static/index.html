<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart CCTV Mini</title>
<style>
  :root { --bg: #0f1216; --panel: #181d23; --line: #2a313a; --text: #e6e9ed; --muted: #8b95a1; --ok: #3fb950; --warn: #d29922; --bad: #f85149; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; }
  #models { color: var(--muted); }
  main { padding: 16px; display: grid; gap: 16px; }
  .cam { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cam h2 { font-size: 14px; margin: 0; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .meta { color: var(--muted); font-weight: normal; }
  .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1px; background: var(--line); }
  figure { margin: 0; background: #000; }
  figcaption { padding: 6px 12px; background: var(--panel); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
  .events { padding: 8px 12px; color: var(--bad); min-height: 34px; }
  .off { padding: 24px 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Smart CCTV Mini — APD &amp; Vehicle</h1>
  <span id="models">memuat model…</span>
</header>
<main id="cams"></main>
<script>
const cams = document.getElementById('cams');
const built = {};

function build(cam) {
  const el = document.createElement('section');
  el.className = 'cam';
  el.innerHTML = '<h2><span class="dot"></span><span class="name"></span><span class="meta"></span></h2>' +
    (cam.ai_enabled
      ? '<div class="views">' + ['apd', 'vehicle'].map(m =>
          '<figure><figcaption>' + (m === 'apd' ? 'APD detection' : 'Vehicle violation') + '</figcaption>' +
          '<img alt="' + m + '" src="/stream/' + cam.id + '/' + m + '"></figure>').join('') + '</div>' +
        '<div class="events"></div>'
      : '<div class="off">AI dimatikan untuk kamera ini (CCTV_' + cam.id + '_AI_ENABLED=false).</div>');
  el.querySelector('.name').textContent = 'CCTV ' + cam.id + ' — ' + cam.name;
  // Reconnect a stream that dropped (camera reconnect, container restart).
  el.querySelectorAll('img').forEach(img => img.onerror = () => setTimeout(() => { img.src = img.src.split('?')[0] + '?t=' + Date.now(); }, 2000));
  cams.appendChild(el);
  return el;
}

async function refresh() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    document.getElementById('models').textContent = 'model: ' + s.models + ' · device: ' + s.device + (s.model_error ? ' · ' + s.model_error : '');
    for (const cam of s.cameras) {
      const el = built[cam.id] || (built[cam.id] = build(cam));
      const dot = el.querySelector('.dot');
      dot.className = 'dot ' + (!cam.ai_enabled ? '' : cam.ready ? 'ok' : cam.connected ? 'warn' : 'bad');
      el.querySelector('.meta').textContent = !cam.ai_enabled ? '' :
        cam.ready ? cam.fps + ' sampel/dtk · ' + cam.ms + ' ms/sampel' : (cam.error || 'menyambung…');
      const ev = el.querySelector('.events');
      if (ev) ev.textContent = cam.events.length ? 'Pelanggaran: ' + cam.events.map(e => e.label).join(', ') : '';
    }
  } catch (e) {
    document.getElementById('models').textContent = 'server tidak terjangkau';
  }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
