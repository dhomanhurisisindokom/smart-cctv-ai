# Database: SQL Server 2022 + migration skema (Alembic). Jalankan PERTAMA:
#   docker compose up -d
# Service `migrate` jalan sekali: membuat database bila belum ada, menjalankan
# `alembic upgrade head`, lalu membuat akun admin awal bila tabel users masih kosong.
name: smartcctv-mini-sql

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartcctv_mini_sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      # GPU server is shared: keep SQL Server from taking most of the RAM.
      MSSQL_MEMORY_LIMIT_MB: "${MSSQL_MEMORY_LIMIT_MB:-2048}"
    ports:
      # Local only; the API and web reach it through the smartcctv_mini network.
      - "127.0.0.1:${MINI_SQL_PORT:-14330}:1433"
    volumes:
      - mini_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrate:
    build: ./migrate
    image: smartcctv-mini-migrate:latest
    container_name: smartcctv_mini_migrate
    environment:
      # Migration target. Default = the sqlserver container above; set DB_* in .env to migrate
      # another SQL Server instead (the login needs CREATE DATABASE on first install).
      DB_HOST: "${DB_HOST:-sqlserver}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:-${MSSQL_SA_PASSWORD}}"
      DB_NAME: "${DB_NAME:-${MINI_DB:-smartcctv_mini}}"
      # Only used when the users table is empty (first install).
      MINI_ADMIN_USERNAME: "${MINI_ADMIN_USERNAME:-admin}"
      MINI_ADMIN_PASSWORD: "${MINI_ADMIN_PASSWORD:?Set MINI_ADMIN_PASSWORD in .env}"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

volumes:
  mini_sql_data:

networks:
  default:
    # Shared with ../fastapi and ../web (they join it as an external network).
    name: smartcctv_mini
